missing_section_advice:
  summary:
    severity: low
    title: Add a short summary at the top
    detail: >-
      Two lines saying what you study and what you are looking for gives a recruiter context
      before they reach your experience.
  education:
    severity: critical
    title: Add an Education section
    detail: >-
      As a student this is the section employers look for first. Include your degree,
      institution and expected graduation year.
  experience:
    severity: high
    title: Add an Experience section
    detail: >-
      Internships, part-time work, teaching assistance and volunteering all count. Describe what
      you did and what resulted.
  skills:
    severity: high
    title: Add a Skills section
    detail: >-
      A short, scannable list of tools and languages is how most keyword matching finds you.
  projects:
    severity: medium
    title: Add a Projects section
    detail: >-
      With limited work history, coursework and personal projects are your strongest evidence.
      Two entries with links are enough.
  contact:
    severity: critical
    title: Add your contact details
    detail: >-
      No contact block was found. Put your name, email and phone number at the top of page one.
