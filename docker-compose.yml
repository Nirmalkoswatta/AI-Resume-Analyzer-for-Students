services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      RESUME_API_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      RESUME_API_LOG_LEVEL: info
      RESUME_API_TRUSTED_PROXY_COUNT: "1"
      RESUME_API_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      RESUME_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
